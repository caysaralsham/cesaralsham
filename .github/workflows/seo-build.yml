name: تحديث صفحات الأعمال (SEO)

on:
  schedule:
    - cron: '17 */3 * * *'   # كل 3 ساعات (حتى العناوين الجديدة تبين بسرعة بدون ما ترجع القديمة لحظة التحميل)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'works.html'
      - 'videos.html'
      - 'index.html'
      - 'tools/build-seo.mjs'
      - '.github/workflows/seo-build.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: seo-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: بناء صفحات الأقسام من Firestore
        run: node tools/build-seo.mjs
      - name: حفظ التغييرات
        id: commit
        run: |
          git config user.name "seo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "ما في تغيير"
          else
            git commit -m "تحديث صفحات الأعمال والـ sitemap تلقائياً"
            git push
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: إعادة نشر الموقع
        if: steps.commit.outputs.changed == 'yes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
