<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#3B2414">
<title>المعرض</title><link rel="icon" href="/my/icon-192.png"><link rel="apple-touch-icon" href="/my/icon-180.png">
<style>html,body{margin:0;height:100%;background:#F5ECDD;overflow:hidden}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}#ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#F5ECDD;color:#3B2414;font-family:Cairo,Tahoma,sans-serif;text-align:center;padding:20px;z-index:2}#ld b{font-size:18px}#ld .sp{width:34px;height:34px;border:4px solid #E6D6BC;border-top-color:#9A6A3A;border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}#ld button,#ld a{font:inherit;font-weight:700;padding:10px 18px;border-radius:10px;border:1px solid #9A6A3A;background:#9A6A3A;color:#fff;text-decoration:none;cursor:pointer}#ld a{background:#fff;color:#9A6A3A}</style>
</head><body>
<!-- البرنامج نفسه على github.io، هون بس منعرضه جوّا موقعنا حتى يفتح من «أدواتي» بلا شريط المتصفح -->
<div id="ld"><div class="sp"></div><b>جاري فتح المعرض...</b><div id="lm" style="font-size:13px"></div></div>
<iframe id="app" src="https://caysaralsham.github.io/miracos-accounting/" title="المعرض" allow="clipboard-read; clipboard-write; camera; fullscreen; web-share; storage-access" allowfullscreen></iframe>
<script>
// البرنامج جوّا الإطار بيبعت «جاهز» لما يفتح. إذا ما وصل خلال 15 ثانية (نت ضعيف أو الصفحة ما انفتحت)
// منبيّن رسالة مفهومة مع «إعادة المحاولة» و«افتح مباشرة» — بدل الصفحة البيضا أو «تعذر الوصول».
(function(){var ld=document.getElementById('ld'),f=document.getElementById('app'),src=f.src,t=null,ok=false;
 function arm(){clearTimeout(t);t=setTimeout(function(){if(ok)return;ld.style.display='flex';ld.innerHTML='<b>البرنامج تأخر بالفتح</b><div style="font-size:14px">'+(navigator.onLine?'النت ضعيف أو الصفحة ما ردّت.':'ما في إنترنت هلق.')+'</div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button type="button" id="rt">إعادة المحاولة</button><a href="'+src+'" target="_top">افتح البرنامج مباشرة</a></div>';
   document.getElementById('rt').onclick=function(){ld.innerHTML='<div class="sp"></div><b>جاري المحاولة...</b>';f.src=src+(src.indexOf('?')<0?'?':'&')+'r='+Date.now();arm()}},15000)}
 window.addEventListener('message',function(e){if(e.origin==='https://caysaralsham.github.io'&&e.data&&e.data.type==='miracos-ready'){ok=true;clearTimeout(t);ld.style.display='none'}});
 arm();})();
</script>
</body></html>
