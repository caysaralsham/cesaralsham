<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>صور فيسبوك — قيصر الشام</title><meta name="theme-color" content="#3B2414">
<link rel="icon" href="/my/icon-192.png"><link rel="apple-touch-icon" href="/my/icon-180.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--ink:#3B2414;--br:#9A6A3A;--deep:#6E4524;--bg:#F5ECDD;--card:#FBF6EE;--line:#E6D6BC;--ok:#2F7D4A;--bad:#A6453D}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:var(--ink);color:#F5ECDD;padding:10px 16px;position:sticky;top:0;z-index:20}
header b{font-size:19px;color:#D9B98C}header small{display:block;font-size:12px;opacity:.85}
main{max-width:1150px;margin:0 auto;padding:12px 16px 90px}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:800;padding:8px 14px;border:0;border-radius:11px;background:var(--br);color:#fff;cursor:pointer;white-space:nowrap}
.btn.l{background:#fff;color:var(--deep);border:1.5px solid var(--line)}.btn.ok{background:var(--ok)}.btn.s{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
select,input[type=text],input[type=email],input[type=password]{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.chip{font:inherit;font-weight:700;font-size:13px;padding:5px 11px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--deep);cursor:pointer}
.chip.on{background:var(--br);color:#fff;border-color:var(--br)}
#st{font-weight:800;font-size:14px;margin-top:8px}
.bar{height:8px;background:#eadfcb;border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;width:0;background:var(--br);transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card.x{opacity:.45}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:#eee;display:block}
.card .b{padding:7px 8px;display:flex;flex-direction:column;gap:5px}
.card select{width:100%;font-size:13px;padding:5px}
.tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;align-self:flex-start}
.tag.on{background:#E3F1E7;color:var(--ok)}.tag.new{background:#FFF1D9;color:#9A5B00}
.card label{font-size:12.5px;font-weight:700;display:flex;gap:6px;align-items:center;cursor:pointer}
#login{max-width:360px;margin:40px auto;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px;display:none}
#login label{display:block;font-weight:800;font-size:13px;margin:10px 0 4px}#login input{width:100%}
#err{color:var(--bad);font-weight:800;font-size:13px;margin-top:8px}
#app{display:none}
.hint{font-size:13px;color:var(--deep);line-height:1.7}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-weight:700;display:none;z-index:50}
</style>
<style id="sb-right">/* شريط التمرير على اليمين (كمبيوتر بس) */@media (min-width:900px) and (hover:hover){html{direction:ltr}body{direction:rtl}}</style>
</head><body>
<header><b>📘 صور فيسبوك</b><small>سحب صور الصفحة، تصنيفها بالأقسام، الباركود، ملف مضغوط، وإضافة الناقص للموقع</small></header>

<form id="login"><b style="font-size:17px">تسجيل الدخول</b><label>البريد الإلكتروني</label><input id="em" type="email" autocomplete="username" required><label>كلمة السر</label><input id="pw" type="password" autocomplete="current-password" required><button class="btn" style="margin-top:12px;width:100%">دخول</button><div id="err"></div></form>

<div id="app"><main>
<div class="box">
  <div class="row"><button class="btn" id="go">1) اسحب صور فيسبوك وصنّفها</button><button class="btn l" id="stop" style="display:none">وقّف</button></div>
  <div class="hint">بيجيب كل صور صفحتك (قراءة فقط — ما بيغيّر شي على فيسبوك)، بيشيل المكرر، بيعرف الصور الموجودة بالموقع وبياخد قسمها، والباقي بيصنّفه بالذكاء الاصطناعي. فيك تصحّح القسم من كل صورة.</div>
  <div id="st"></div><div class="bar"><i id="pb"></i></div>
</div>
<div class="box" id="tools" style="display:none">
  <div class="row" id="chips"></div>
  <div class="row" style="margin-top:8px">
    <button class="chip on" data-f="all">الكل</button><button class="chip" data-f="new">مش بالموقع</button><button class="chip" data-f="site">بالموقع</button><button class="chip" data-f="x">مش شغل</button>
  </div>
  <div class="row" style="margin-top:10px">
    <button class="btn ok" id="zip">⬇️ ملف مضغوط بالباركود (مجلد لكل قسم)</button>
    <button class="btn" id="add">➕ أضف المحدّدة للموقع</button>
    <span class="hint" id="selN"></span>
  </div>
</div>
<div class="grid" id="grid"></div>
</main></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2200)};
const sleep=ms=>new Promise(z=>setTimeout(z,ms));
let A,db,st,PH=[],CATS=[],SITE=[],F='all',CF='',STOP=false;
const X='— مش شغل رخام —';
let SAVED={};try{SAVED=JSON.parse(localStorage.getItem('fbs_cat')||'{}')}catch(e){}
const saveCats=()=>{try{localStorage.setItem('fbs_cat',JSON.stringify(SAVED))}catch(e){}};
const tok=async()=>A.currentUser.getIdToken();
const setSt=(t,p)=>{$('#st').textContent=t;if(p!=null)$('#pb').style.width=Math.round(p*100)+'%'};
const fr=c=>{const p=String(c||'').split('|');return (p[1]||p[0]||'').trim()};
const ar=c=>String(c||'').split('|')[0].trim();

let qrImgP=null;
function getQrImg(){ if(!qrImgP) qrImgP=new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src='/img/site/qr-links.png?v=1';}); return qrImgP; }
getQrImg();
async function drawQrMark(ctx, W, H){
  const qr = await getQrImg(); if(!qr) return;
  const S=Math.min(W,H), side=Math.round(Math.max(110,S*0.16)), mx=Math.round(S*0.045), my=mx;
  const fs=Math.max(12,Math.round(side*0.12)), pad=Math.round(side*0.08);
  const pw=side+2*pad, ph=side+2*pad+Math.round(fs*1.25)*2+Math.round(fs*.2);
  const X0=mx, Y0=H-my-ph;
  ctx.save();ctx.shadowColor='rgba(0,0,0,0.45)';ctx.shadowBlur=pad*1.5;ctx.shadowOffsetY=3;ctx.fillStyle='#FFFDF8';
  ctx.beginPath();ctx.roundRect?ctx.roundRect(X0,Y0,pw,ph,pad):ctx.rect(X0,Y0,pw,ph);ctx.fill();ctx.restore();
  ctx.save();ctx.strokeStyle='#D4AF37';ctx.lineWidth=Math.max(2,Math.round(fs/6));ctx.beginPath();ctx.roundRect?ctx.roundRect(X0,Y0,pw,ph,pad):ctx.rect(X0,Y0,pw,ph);ctx.stroke();
  ctx.imageSmoothingEnabled=false;ctx.drawImage(qr,X0+pad,Y0+pad,side,side);ctx.imageSmoothingEnabled=true;
  ctx.textAlign='center';ctx.textBaseline='top';const cx=X0+pw/2,ty=Y0+pad+side+Math.round(fs*.15);
  ctx.fillStyle='#2E1C10';ctx.font='bold '+fs+'px Tahoma, Arial, sans-serif';ctx.fillText('امسح الرمز',cx,ty);
  ctx.fillStyle='#8A5A1E';ctx.font='900 '+Math.round(fs*1.1)+'px Tahoma, Arial, sans-serif';ctx.fillText('0541737888',cx,ty+Math.round(fs*1.25));
  ctx.restore();
}

function oldLogoCutX(img){
  try{const W=img.naturalWidth||img.width,H=img.naturalHeight||img.height,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);
    const lw=W*0.12,fs=Math.max(13,Math.round(W*0.015)),lg=Math.round(fs*.35),pY=Math.round(fs*.55),tb=(fs+lg)*2-lg+pY*2,m=Math.round(W*0.0125),bx=W-lw-m,ty=H-m-tb;
    const rx=Math.round(bx+lw*.1),ry=Math.round(ty+tb*.15),rw=Math.round(lw*.8),rh=Math.max(4,Math.round(tb*.7));if(rx<0||ry<0)return 0;
    const d=x.getImageData(rx,ry,rw,rh).data;let n=0,dk=0,wh=0;for(let i=0;i<d.length;i+=4){const L=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];n++;if(L<100)dk++;if(L>190)wh++}
    return (dk/n>0.6&&wh/n>0.03&&wh/n<0.4)?Math.round(bx-fs*0.8):0;}catch(e){return 0}
}

// بصمة الصورة (dHash 64 بت) — نفس اللي استعملناه لمطابقة القصص
function dh(im){const c=document.createElement('canvas');c.width=9;c.height=8;const x=c.getContext('2d');x.drawImage(im,0,0,9,8);const d=x.getImageData(0,0,9,8).data;const b=[];for(let y=0;y<8;y++)for(let i=0;i<8;i++){const a=(y*9+i)*4,q=a+4;b.push((d[a]+d[a+1]+d[a+2])>(d[q]+d[q+1]+d[q+2])?1:0)}return b}
const ham=(a,b)=>{let n=0;for(let i=0;i<64;i++)if(a[i]!==b[i])n++;return n};
const loadUrl=u=>new Promise((res,rej)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=()=>rej(new Error('img'));i.src=u});
async function fbBlob(p){const r=await fetch('/api/meta-photos?img='+encodeURIComponent(p.src),{headers:{authorization:'Bearer '+await tok()}});if(!r.ok)throw new Error('img '+r.status);return r.blob()}
async function fbImg(p){if(p._im)return p._im;const b=await fbBlob(p);const u=URL.createObjectURL(b);const im=await loadUrl(u);p._im=im;p.thumb=u;return im}
function small(im,max=512){const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.8)}

async function loadSite(){const s=await db.collection('cesar_website').get();const all=[];s.forEach(d=>{if(d.id.startsWith('items_'))(d.data().items||[]).forEach(it=>{if(it&&it.img)all.push(it)})});
  CATS=[...new Set(all.map(x=>(x.category||'').trim()).filter(Boolean))];return all}

async function run(){STOP=false;$('#go').disabled=true;$('#stop').style.display='';
 try{
  setSt('جارٍ تحميل صور الموقع…',0);const items=await loadSite();SITE=[];
  let k=0;for(const it of items){if(STOP)break;k++;setSt(`بصمات صور الموقع ${k} من ${items.length}`,k/items.length*.2);
    for(const u of [it.img,it.oldImg].filter(u=>u&&/^https:/.test(u))){try{SITE.push({h:dh(await loadUrl(u)),cat:(it.category||'').trim(),id:it.id})}catch(e){}}}
  setSt('جارٍ جلب قائمة صور فيسبوك…',.2);PH=[];let after=null,g=0;
  do{const r=await fetch('/api/meta-photos'+(after?'?after='+encodeURIComponent(after):''),{headers:{authorization:'Bearer '+await tok()}});const d=await r.json();if(!d.ok)throw new Error(d.error||'meta');PH.push(...d.photos);after=d.next;g++;setSt(`صور فيسبوك: ${PH.length}`,.2)}while(after&&g<60&&!STOP);
  const seen=[];let n=0;
  for(const p of PH){if(STOP)break;n++;setSt(`فحص صورة ${n} من ${PH.length}`,.2+.5*n/PH.length);
    try{const im=await fbImg(p);p.h=dh(im);
      const dup=seen.find(q=>ham(q.h,p.h)<=4);if(dup){p.dup=true;continue}seen.push(p);
      let best=99,bc=null;for(const s of SITE){const d=ham(s.h,p.h);if(d<best){best=d;bc=s}}
      if(best<=9){p.onSite=true;p.cat=bc.cat;p.siteId=bc.id}}catch(e){p.bad=true}}
  PH=PH.filter(p=>!p.dup&&!p.bad);
  const need=PH.filter(p=>!p.onSite);let m=0;
  for(const p of need){if(STOP)break;m++;setSt(`تصنيف بالذكاء الاصطناعي ${m} من ${need.length}`,.7+.3*m/Math.max(1,need.length));
    if(SAVED[p.id]!==undefined){p.cat=SAVED[p.id];continue}
    try{const r=await fetch('/api/ai-cat',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+await tok()},body:JSON.stringify({image:small(p._im),cats:CATS})});const d=await r.json();
      if(d.ok){p.cat=d.cat||X;SAVED[p.id]=p.cat;saveCats()}else if(d.error==='rate'){await sleep(8000)}}catch(e){}
    await sleep(250)}
  PH.forEach(p=>{if(!p.cat)p.cat=X;if(SAVED[p.id]&&p.onSite)delete SAVED[p.id]});
  setSt(`✓ ${PH.length} صورة (بدون المكرر) — ${PH.filter(p=>p.onSite).length} موجودة بالموقع، ${PH.filter(p=>!p.onSite&&p.cat!==X).length} شغل مش بالموقع، ${PH.filter(p=>p.cat===X).length} مش شغل`,1);
  $('#tools').style.display='';render()
 }catch(e){setSt('صار خطأ: '+e.message)}
 $('#go').disabled=false;$('#stop').style.display='none'}

function list(){return PH.filter(p=>(F==='all'?p.cat!==X:F==='new'?(!p.onSite&&p.cat!==X):F==='site'?p.onSite:p.cat===X)&&(!CF||p.cat===CF))}
function render(){
  const cnt={};PH.filter(p=>p.cat!==X).forEach(p=>cnt[p.cat]=(cnt[p.cat]||0)+1);
  $('#chips').innerHTML=`<button class="chip${CF?'':' on'}" data-c="">كل الأقسام</button>`+CATS.filter(c=>cnt[c]).map(c=>`<button class="chip${CF===c?' on':''}" data-c="${esc(c)}">${esc(fr(c))} (${cnt[c]})</button>`).join('');
  const L=list();const opts=[...CATS,X];
  $('#grid').innerHTML=L.map(p=>`<div class="card${p.cat===X?' x':''}" data-id="${p.id}"><img loading="lazy" src="${p.thumb||''}">
   <div class="b">${p.onSite?'<span class="tag on">✓ موجودة بالموقع</span>':'<span class="tag new">مش بالموقع</span>'}
   <select data-a="cat">${opts.map(c=>`<option${c===p.cat?' selected':''} value="${esc(c)}">${esc(c===X?c:fr(c)+' — '+ar(c))}</option>`).join('')}</select>
   ${!p.onSite&&p.cat!==X?`<label><input type="checkbox" data-a="sel"${p.sel?' checked':''}> أضفها للموقع</label>`:''}</div></div>`).join('');
  $('#selN').textContent=PH.filter(p=>p.sel).length?`محدّد للموقع: ${PH.filter(p=>p.sel).length}`:''}
$('#grid').addEventListener('change',e=>{const c=e.target.closest('.card');if(!c)return;const p=PH.find(x=>x.id===c.dataset.id);
  if(e.target.dataset.a==='cat'){p.cat=e.target.value;if(!p.onSite){SAVED[p.id]=p.cat;saveCats()}if(p.cat===X)p.sel=false;render()}
  if(e.target.dataset.a==='sel'){p.sel=e.target.checked;render()}});
document.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;if(b.dataset.c!==undefined){CF=b.dataset.c;render()}else if(b.dataset.f){F=b.dataset.f;document.querySelectorAll('.chip[data-f]').forEach(x=>x.classList.toggle('on',x===b));render()}});
$('#go').onclick=run;$('#stop').onclick=()=>{STOP=true};

// الصورة النهائية: بنشيل اللوغو القديم (إذا موجود) وبنحط الباركود يسار تحت — نفس لوحة الأعمال
async function makeQr(im,maxW){const cut=oldLogoCutX(im);const w0=cut||im.naturalWidth,h0=im.naturalHeight;const s=Math.min(1,(maxW||99999)/w0);
  const w=Math.round(w0*s),h=Math.round(h0*s);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0,w0,h0,0,0,w,h);await drawQrMark(x,w,h);return c}
const toBlob=c=>new Promise(r=>c.toBlob(r,'image/jpeg',.88));

$('#zip').onclick=async()=>{const L=list().filter(p=>p.cat!==X);if(!L.length)return toast('لا يوجد صور');if(typeof JSZip==='undefined')return toast('انتظر ثانية وأعد المحاولة');
  const btn=$('#zip');btn.disabled=true;const z=new JSZip();let i=0;const cnt={};
  for(const p of L){i++;btn.textContent=`جارٍ ${i} من ${L.length}…`;try{const c=await makeQr(await fbImg(p));const f=(fr(p.cat)||'Autres').replace(/[\\/:*?"<>|]/g,'-');cnt[f]=(cnt[f]||0)+1;
    z.folder(f).file(`${f} ${String(cnt[f]).padStart(3,'0')}.jpg`,await toBlob(c))}catch(e){}}
  btn.textContent='جارٍ تجهيز الملف…';const b=await z.generateAsync({type:'blob'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='صور-فيسبوك-بالباركود-'+new Date().toISOString().slice(0,10)+'.zip';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),4000);
  btn.disabled=false;btn.textContent='⬇️ ملف مضغوط بالباركود (مجلد لكل قسم)';toast('تم ✓')};

// الإضافة للموقع: الصورة بتنرفع بالباركود، وبتنحط بقائمة انتظار — لوحة الأعمال بتكمّلها (عنوان ووصف بالذكاء الاصطناعي) لحالها
$('#add').onclick=async()=>{const L=PH.filter(p=>p.sel&&!p.onSite&&p.cat!==X);if(!L.length)return toast('حدّد صور «أضفها للموقع» أول');
  if(!confirm(`إضافة ${L.length} صورة للموقع؟`))return;const btn=$('#add');btn.disabled=true;let ok=0;const q=[];
  for(const p of L){btn.textContent=`جارٍ ${ok+1} من ${L.length}…`;try{const c=await makeQr(await fbImg(p),1600);const id='fb'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const ref=st.ref('gallery/'+id+'.jpg');await ref.put(await toBlob(c),{contentType:'image/jpeg'});const url=await ref.getDownloadURL();
    q.push({id,img:url,category:p.cat,fbId:p.id,at:p.at||''});p.onSite=true;p.sel=false;ok++}catch(e){console.error(e)}}
  if(q.length){const ref=db.collection('cesar_website').doc('fb_queue');await db.runTransaction(async t=>{const d=await t.get(ref);const old=(d.exists&&d.data().items)||[];t.set(ref,{items:[...old,...q],updatedAt:Date.now()})})}
  btn.disabled=false;btn.textContent='➕ أضف المحدّدة للموقع';render();
  toast(`✓ ${ok} صورة جاهزة — افتح «لوحة الموقع» لتكمل الإضافة`)};

  $('#login').addEventListener('submit',async e=>{e.preventDefault();$('#err').textContent='';try{await A.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value)}catch(x){$('#err').textContent='البريد الإلكتروني أو كلمة السر غير صحيحة'}});
});
</script>

</body></html>
