<style>
:root{--ink:#3B2414;--br:#9A6A3A;--deep:#6E4524;--bg:#F5ECDD;--line:#E6D6BC}
*{box-sizing:border-box}body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{background:var(--ink);color:#F5ECDD;padding:12px 16px;text-align:center}header b{font-size:24px;color:#D9B98C;display:block}header span{font-size:13px;opacity:.85}
main{max-width:900px;margin:0 auto;padding:14px 16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:700px){main{grid-template-columns:repeat(4,1fr)}}
a{display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;text-align:center;background:#FBF6EE;border:1.5px solid var(--line);border-radius:16px;padding:14px 8px;text-decoration:none;color:var(--ink);font-weight:800;font-size:15px;min-height:96px;box-shadow:0 8px 20px rgba(59,36,20,.06)}
a:hover{border-color:var(--br)}a i{font-style:normal;font-size:26px}a small{font-weight:600;font-size:12px;color:var(--deep)}
@media(max-width:380px){main{grid-template-columns:1fr}}
#login{max-width:360px;margin:30px auto;padding:20px 16px;background:#FBF6EE;border:1.5px solid var(--line);border-radius:16px;display:none}
#login label{display:block;font-weight:800;font-size:13px;margin:10px 0 4px}#login input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#F5ECDD}
#login button,#out{width:100%;margin-top:14px;font:inherit;font-weight:800;padding:11px;border:0;border-radius:12px;background:var(--br);color:#fff;cursor:pointer}
#err{color:#A6453D;font-size:13px;min-height:1em;margin-top:8px}main{display:none}#out{display:none;max-width:200px;margin:0 auto 24px;background:transparent;color:var(--deep);border:1.5px solid var(--line)}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
firebase.initializeApp({apiKey:"AIzaSyDi1Pn7guMnyc0CetV8Z9IUC-k0gtav2_8",authDomain:"basel-7b29b.firebaseapp.com",projectId:"basel-7b29b",storageBucket:"basel-7b29b.firebasestorage.app",messagingSenderId:"1025769465563",appId:"1:1025769465563:web:53b5c9949dbb26364d8efe"});
const A=firebase.auth(),L=document.getElementById('login'),M=document.querySelector('main'),O=document.getElementById('out');
A.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
