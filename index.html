<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مرسم الحجر</title>
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3B2A1F">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مرسم الحجر">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D9DCD8; --panel:#F2F2EE; --ink:#20272D; --muted:#5B646A; --line:#BFC3BE;
  --accent:#8A672B; --accent-ink:#FFFFFF; --sheet:#F8F7F3; --sheet-line:#2B3238;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#181C20; --panel:#232830; --ink:#E6E8E4; --muted:#9AA3A9; --line:#39414A;
    --accent:#C9A15A; --accent-ink:#1B1B1B; --sheet:#ECEBE5;
  }
}
:root[data-theme="dark"]{
  --bg:#181C20; --panel:#232830; --ink:#E6E8E4; --muted:#9AA3A9; --line:#39414A;
  --accent:#C9A15A; --accent-ink:#1B1B1B; --sheet:#ECEBE5;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Kufi Arabic","Segoe UI",Tahoma,Arial,sans-serif;font-size:15px;line-height:1.7}
header{max-width:1320px;margin:0 auto;padding:22px 20px 10px;display:flex;flex-wrap:wrap;
  align-items:flex-end;justify-content:space-between;gap:14px}
h1{margin:0;font-size:clamp(1.6rem,3.2vw,2.3rem);font-weight:800;letter-spacing:0;line-height:1.2}
header p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.tabs{display:flex;gap:0;border:1.5px solid var(--ink);border-radius:999px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs button{font:inherit;font-weight:600;background:transparent;color:var(--ink);border:0;
  padding:9px 18px;cursor:pointer;font-size:.95rem;white-space:nowrap;flex:0 0 auto}
.tabs button+button{border-inline-start:1.5px solid var(--ink)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
main{max-width:1320px;margin:0 auto;padding:10px 20px 30px;display:grid;
  grid-template-columns:330px 1fr;gap:20px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 18px 16px}
.ctrl{padding:12px 0;border-bottom:1px solid var(--line)}
.ctrl:last-of-type{border-bottom:0}
.ctrl .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.ctrl label,.ctrl .lbl{font-size:.88rem;font-weight:600}
.ctrl output{font-size:.85rem;color:var(--accent);font-weight:600;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--accent);direction:ltr}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:.84rem;padding:5px 12px;border-radius:4px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mats{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:38px;height:38px;border-radius:50%;cursor:pointer;border:2px solid transparent;padding:0;
  background:radial-gradient(circle at 35% 30%,var(--c) 0 45%,var(--d) 100%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.sw[aria-pressed="true"]{border-color:var(--ink);outline:2px solid var(--panel);outline-offset:-4px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.reset{margin-top:12px;font:inherit;font-size:.85rem;background:transparent;color:var(--muted);
  border:1px dashed var(--line);border-radius:4px;padding:6px 12px;cursor:pointer;width:100%}
.sheet{background:var(--sheet);color:#2B3238;border-radius:3px;padding:14px;position:relative;
  box-shadow:0 1px 0 rgba(0,0,0,.08),0 10px 30px -18px rgba(0,0,0,.45)}
.frame{border:1.5px solid var(--sheet-line);outline:.5px solid var(--sheet-line);outline-offset:-5px;
  padding:12px;display:flex;flex-direction:column;gap:10px}
#draw{width:100%;height:auto;max-height:68vh;display:block}
.block{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1.5px solid var(--sheet-line)}
.block div{padding:8px 10px;border-inline-start:1px solid #B8BAB5}
.block div:first-child{border-inline-start:0}
.block dt{font-size:.75rem;color:#5D656B}
.block dd{margin:0;font-weight:800;font-size:1.02rem}
.note{font-size:.82rem;color:#8A3B22;min-height:1em;margin:0}
.hint{font-size:.8rem;color:var(--muted);margin:10px 2px 0}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}
.actions label{display:flex;flex-direction:column;font-size:.8rem;font-weight:600;gap:3px;flex:1 1 150px}
.actions input{font:inherit;font-size:.9rem;padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)}
.btn{font:inherit;font-weight:600;font-size:.9rem;padding:8px 16px;border-radius:4px;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink);white-space:nowrap}
.btn.wa{background:#1F8F55;border-color:#1F8F55;color:#fff}
.btn:disabled{opacity:.5;cursor:wait}
.ttl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1.5px solid var(--sheet-line);padding-bottom:6px;flex-wrap:wrap}
.ttl b{font-size:1.15rem;font-weight:800}
.ttl span{font-size:.85rem;color:#5D656B}
.toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px;z-index:30}
.modal.on{display:flex}
.modal img{max-width:100%;max-height:75vh;border-radius:4px;background:#fff}
.modal p{color:#fff;margin:0;text-align:center}
.ai{background:var(--panel);border:1.5px solid var(--accent);border-radius:6px;padding:12px;margin-bottom:12px}
.airow{display:flex;gap:8px;flex-wrap:wrap}
.airow textarea{flex:1 1 260px;font:inherit;font-size:.95rem;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);resize:vertical;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.aiout{margin:8px 2px 0;font-size:.9rem;min-height:1.2em;white-space:pre-wrap}
.aiout.err{color:#B0442A}
.box{background:var(--panel);color:var(--ink);border-radius:8px;padding:20px;width:min(440px,100%);display:flex;flex-direction:column;gap:12px}
.box h2{margin:0;font-size:1.1rem}
.box label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600}
.box input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);direction:ltr}
.box small{color:var(--muted);font-weight:400;line-height:1.6}
@media (max-width:860px){
  main{grid-template-columns:1fr}
  .stage{order:-1}
  #draw{max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div>
    <h1>مرسم الحجر</h1>
    <p>رسم مبسّط بالقياسات لأعمال الرخام والحجر الطبيعي.</p>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<main>
  <section class="panel" id="panel" aria-label="الإعدادات"></section>
  <section class="stage">
    <div class="ai" id="aiBox" hidden>
      <div class="airow">
        <textarea id="aiIn" rows="1" placeholder="اكتب شو بدك تعدّل، مثلاً: خلّي الواجهة 3 طوابق والشبابيك مدببة بلون بيج غامق"></textarea>
        <button class="btn primary" id="aiGo">نفّذ</button>
        <button class="btn" id="aiUndo" disabled>تراجع</button>
        <button class="btn" id="aiSet" hidden aria-label="إعدادات الذكاء الاصطناعي">إعدادات</button>
      </div>
      <p class="aiout" id="aiOut" role="status"></p>
    </div>
    <div class="actions">
      <label>اسم الشركة<input id="company" value="قيصر الشام للرخام والحجر"></label>
      <label>الزبون أو المشروع<input id="project" placeholder="مثلاً: فيلا أبو أحمد"></label>
      <button class="btn" id="saveBtn">حفظ صورة</button>
      <button class="btn wa" id="shareBtn">إرسال واتساب</button>
    </div>
    <div class="sheet">
      <div class="frame">
        <div class="ttl"><b id="tCompany"></b><span id="tProject"></span></div>
        <svg id="draw" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="الرسم"></svg>
        <p class="note" id="note"></p>
        <dl class="block" id="stats"></dl>
      </div>
    </div>
    <p class="hint">القياسات بالسنتيمتر والرسم تقريبي للعرض على الزبون، وليس مخططاً تنفيذياً.</p>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>
<div class="modal" id="setModal"><div class="box">
  <h2>إعدادات الذكاء الاصطناعي</h2>
  <label>المزوّد<select id="apiProv" style="font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)"><option value="gemini">Google Gemini (مجاني)</option><option value="anthropic">Anthropic Claude (مدفوع)</option></select></label>
  <label>المفتاح<input id="apiKey" type="password" autocomplete="off" placeholder="الصق المفتاح هون"><small>المفتاح بينحفظ على هالجهاز بس، وما بينرفع على الموقع.</small></label>
  <label>الموديل<input id="apiModel"></label>
  <div style="display:flex;gap:8px"><button class="btn primary" id="setSave">حفظ</button><button class="btn" id="setClose">إلغاء</button></div>
</div></div>
<div class="modal" id="modal"><img id="mImg" alt="صورة التصميم"><p>اضغط مطوّلاً على الصورة واختر حفظ أو مشاركة</p><button class="btn" style="color:#fff;border-color:#fff" id="mClose">إغلاق</button></div>

<script>
const MATS={
  italian:{name:'أبيض إيطالي',c:'#F4F3F0',d:'#CFCFCB',v:'#7E868C',n:6,o:.7},
  beigeL:{name:'بيج فاتح',c:'#ECE0C8',d:'#CDBB98',v:'#B5A07A',n:4,o:.45},
  beigeD:{name:'بيج غامق',c:'#C6A97E',d:'#9C8159',v:'#7E6442',n:4,o:.5},
  grey:{name:'رمادي',c:'#A5A9AB',d:'#7B8083',v:'#545B5F',n:5,o:.55},
  brown:{name:'بني غامق',c:'#5D4434',d:'#3B2A1F',v:'#CDAE89',n:7,o:.5},
  black:{name:'أسود بعروق بيضاء',c:'#2B2D2F',d:'#141516',v:'#E4E4E0',n:5,o:.7},
  green:{name:'أخضر',c:'#3F5848',d:'#24352A',v:'#BACAB7',n:6,o:.5},
  rosa:{name:'وردي',c:'#E7CABC',d:'#C29D8C',v:'#A57A68',n:4,o:.45},
  yellow:{name:'حجر أصفر',c:'#DDBF7C',d:'#B8954C',v:'#A37F3A',n:4,o:.4},
  red:{name:'حجر أحمر',c:'#B97A60',d:'#8C5442',v:'#7A4433',n:4,o:.4},
  trav:{name:'ترافرتين',c:'#DCC9A6',d:'#B49E78',v:'#9C845C',s:1},
  basalt:{name:'بازلت',c:'#4C5054',d:'#2D3033',v:'#6E7378',s:1}
};
const INK='#2B3238', DIM='#9C3A25', WATER='#4F9BC2', BRASS='#B08A3E';
let LW=1, FS=10;
const f=n=>Math.round(n*100)/100;
function setScale(S){LW=S/650;FS=S/30;}
const M=k=>`url(#p-${k})`;
const fmt=v=>v>=300?(v/100).toFixed(2)+' م':Math.round(v)+' سم';
const R=(x,y,w,h,fill,sw=LW)=>`<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(Math.max(0,h))}" fill="${fill}" stroke="${INK}" stroke-width="${f(sw)}"/>`;
const P=(d,fill,sw=LW,extra='')=>`<path d="${d}" fill="${fill}" stroke="${INK}" stroke-width="${f(sw)}" stroke-linejoin="round" ${extra}/>`;
const L=(x1,y1,x2,y2,c=INK,sw=LW,extra='')=>`<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="${c}" stroke-width="${f(sw)}" ${extra}/>`;

/* stone textures */
function seeded(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
function buildPatterns(){
  let out='';let seed=7;
  for(const k in MATS){
    const m=MATS[k],rnd=seeded(seed+=13),W=180,H=120;
    let p=`<pattern id="p-${k}" patternUnits="userSpaceOnUse" width="${W}" height="${H}"><rect width="${W}" height="${H}" fill="${m.c}"/>`;
    if(m.s){
      for(let i=0;i<70;i++){p+=`<circle cx="${f(rnd()*W)}" cy="${f(rnd()*H)}" r="${f(.4+rnd()*1.1)}" fill="${k==='trav'?m.d:m.v}" opacity=".55"/>`}
      if(k==='trav'){for(let i=0;i<5;i++){const y=rnd()*H;p+=`<path d="M0 ${f(y)} Q${W/2} ${f(y+rnd()*6-3)} ${W} ${f(y)}" stroke="${m.v}" stroke-width=".6" fill="none" opacity=".45"/>`}}
    }else{
      for(let i=0;i<(m.n||4);i++){
        let x=rnd()*W,y=rnd()*H,d=`M${f(x)} ${f(y)}`;
        for(let j=0;j<3;j++){const nx=x+40+rnd()*50,ny=y+(rnd()-.4)*50;d+=` Q${f((x+nx)/2+rnd()*20-10)} ${f((y+ny)/2+rnd()*20-10)} ${f(nx)} ${f(ny)}`;x=nx;y=ny;}
        p+=`<path d="${d}" stroke="${m.v}" stroke-width="${f(.5+rnd()*.9)}" fill="none" opacity="${m.o||.5}"/>`;
      }
    }
    out+=p+'</pattern>';
  }
  return out;
}
const PATTERNS=buildPatterns();

/* dimensions */
function dimH(x1,x2,y,label){
  const t=FS*.3;
  return `<g stroke="${DIM}" stroke-width="${f(LW*.9)}">`+L(x1,y,x2,y,DIM,LW*.9)+L(x1,y-t*2,x1,y+t*2,DIM,LW*.9)+L(x2,y-t*2,x2,y+t*2,DIM,LW*.9)+
  L(x1-t,y+t,x1+t,y-t,DIM,LW*1.6)+L(x2-t,y+t,x2+t,y-t,DIM,LW*1.6)+`</g><text x="${f((x1+x2)/2)}" y="${f(y-FS*.4)}" text-anchor="middle" font-size="${f(FS)}" fill="${DIM}" font-family="Noto Kufi Arabic,Tahoma,sans-serif">${label}</text>`;
}
function dimV(y1,y2,x,label){
  const t=FS*.3,mid=(y1+y2)/2;
  return L(x,y1,x,y2,DIM,LW*.9)+L(x-t*2,y1,x+t*2,y1,DIM,LW*.9)+L(x-t*2,y2,x+t*2,y2,DIM,LW*.9)+
  L(x-t,y1+t,x+t,y1-t,DIM,LW*1.6)+L(x-t,y2+t,x+t,y2-t,DIM,LW*1.6)+
  `<text transform="translate(${f(x-FS*.45)} ${f(mid)}) rotate(-90)" text-anchor="middle" font-size="${f(FS)}" fill="${DIM}" font-family="Noto Kufi Arabic,Tahoma,sans-serif">${label}</text>`;
}

/* arch / opening outline */
function shapePath(cx,w,top,bottom,type){
  const x1=cx-w/2,x2=cx+w/2,h=bottom-top;
  if(type==='round'||type==='arch'){
    const r=Math.min(w/2,h*.95),sp=top+r;
    return `M${f(x1)} ${f(bottom)}L${f(x1)} ${f(sp)}A${f(w/2)} ${f(r)} 0 0 1 ${f(x2)} ${f(sp)}L${f(x2)} ${f(bottom)}Z`;
  }
  if(type==='pointed'){
    const rise=Math.min(w*.7,h*.95),sp=top+rise;
    return `M${f(x1)} ${f(bottom)}L${f(x1)} ${f(sp)}C${f(x1)} ${f(sp-rise*.55)} ${f(cx-w*.12)} ${f(top+rise*.1)} ${f(cx)} ${f(top)}C${f(cx+w*.12)} ${f(top+rise*.1)} ${f(x2)} ${f(sp-rise*.55)} ${f(x2)} ${f(sp)}L${f(x2)} ${f(bottom)}Z`;
  }
  return `M${f(x1)} ${f(bottom)}L${f(x1)} ${f(top)}L${f(x2)} ${f(top)}L${f(x2)} ${f(bottom)}Z`;
}
function springY(w,top,bottom,type){
  const h=bottom-top;
  if(type==='round'||type==='arch')return top+Math.min(w/2,h*.95);
  if(type==='pointed')return top+Math.min(w*.7,h*.95);
  return top+h*.32;
}

/* ---------- fountain ---------- */
function drawFountain(s){
  const W=+s.poolW,PH=+s.poolH,n=+s.tiers;
  const finH=s.finial==='none'?0:(s.finial==='ball'?28:40);
  const minH=PH+finH+n*45,H=Math.max(+s.total,minH);
  const S=Math.max(W,H);setScale(S);
  const m=M(s.mat);let o='',water='';
  o+=R(-W/2+4,-8,W-8,8,m);
  o+=R(-W/2+8,-PH+10,W-16,PH-18,m);
  const segs=Math.max(2,Math.round((W-16)/80));
  for(let k=1;k<segs;k++){const x=-W/2+8+(W-16)*k/segs;o+=L(x,-PH+10,x,-8,INK,LW*.6)}
  o+=R(-W/2,-PH,W,10,m);
  const avail=H-PH-finH,stem=Math.max(12,W*.06);
  let prevY=-PH,lastBW=W*.3;
  for(let i=0;i<n;i++){
    const top=-(PH+avail*(i+1)/n),bw=W*(.62-i*.16),bh=Math.min(avail/n*.42,26),bottom=top+bh,cw=stem*(1-i*.18);
    o+=R(-cw*.85,prevY-6,cw*1.7,6,m);
    o+=R(-cw/2,bottom,cw,prevY-6-bottom,m);
    const lip=Math.min(6,bh*.3);
    o+=P(`M${f(-bw/2)} ${f(top)}L${f(bw/2)} ${f(top)}L${f(bw/2)} ${f(top+lip)}Q${f(bw*.3)} ${f(bottom)} ${f(cw*.7)} ${f(bottom)}L${f(-cw*.7)} ${f(bottom)}Q${f(-bw*.3)} ${f(bottom)} ${f(-bw/2)} ${f(top+lip)}Z`,m);
    o+=L(-bw/2,top+lip,bw/2,top+lip,INK,LW*.6);
    if(+s.water){
      const drop=prevY-top;
      for(const sd of[-1,1])for(const j of[0,1]){
        const x0=sd*(bw/2-j*4),x1=sd*(bw/2+8+drop*.16+j*4);
        water+=`<path d="M${f(x0)} ${f(top+1)}Q${f(sd*(bw/2+drop*.14+j*2))} ${f(top+drop*.08)} ${f(x1)} ${f(prevY)}" fill="none" stroke="${WATER}" stroke-width="${f(LW*2.2)}" opacity="${j?.45:.75}" stroke-linecap="round"/>`;
      }
    }
    prevY=top;lastBW=bw;
  }
  if(s.finial==='ball'){o+=R(-5,prevY-8,10,8,m);o+=`<circle cx="0" cy="${f(prevY-18)}" r="10" fill="${m}" stroke="${INK}" stroke-width="${f(LW)}"/>`}
  if(s.finial==='pine'){
    o+=R(-6,prevY-8,12,8,m);
    o+=`<ellipse cx="0" cy="${f(prevY-24)}" rx="11" ry="16" fill="${m}" stroke="${INK}" stroke-width="${f(LW)}"/>`;
    for(let k=1;k<4;k++){const y=prevY-24-16+k*8;o+=`<path d="M-9 ${f(y)}Q0 ${f(y+5)} 9 ${f(y)}" fill="none" stroke="${INK}" stroke-width="${f(LW*.5)}"/>`}
  }
  if(+s.water){
    for(const sd of[-1,1])water+=`<path d="M0 ${f(-H)}Q${f(sd*16)} ${f(-H-32)} ${f(sd*lastBW*.36)} ${f(prevY)}" fill="none" stroke="${WATER}" stroke-width="${f(LW*2)}" opacity=".7" stroke-linecap="round"/>`;
    water+=L(-W/2+14,-PH+3,W/2-14,-PH+3,WATER,LW*1.4,'opacity=".5"');
  }
  o+=water;
  o+=dimH(-W/2,W/2,S*.1,fmt(W))+dimV(0,-H,W/2+S*.09,fmt(H))+dimV(0,-PH,-W/2-S*.07,fmt(PH));
  return{svg:o,box:[-W/2-S*.13,W/2+S*.14,-H-(+s.water?40:0)-S*.05,S*.15],
    stats:[['العرض الكلي',fmt(W)],['الارتفاع الكلي',fmt(H)],['ارتفاع الحوض',fmt(PH)],['عدد الطبقات',n]],
    note:H>+s.total?'رفعتُ الارتفاع الكلي إلى '+fmt(H)+' ليتسع لعدد الطبقات المختار.':''};
}

/* ---------- hammam basin (jurn) ---------- */
function drawJurn(s){
  const w=+s.w,rim=+s.rim,bh=Math.min(+s.bowlH,rim-20),ph=+s.panelH,pw=w+24;
  const S=Math.max(pw,rim+ph);setScale(S);
  const m=M(s.mat);let o='';
  const pedTop=-(rim-bh);
  if(ph>0){
    const top=-(rim+ph),bot=-rim+bh*.5;
    o+=P(shapePath(0,pw,top,bot,s.arch),m);
    o+=P(shapePath(0,pw-18,top+9,bot,s.arch),'rgba(60,45,30,.07)',LW*.7);
    if(ph>=90){
      const cy=-(rim+ph*.62),r=pw*.11;
      let ros=`<circle cx="0" cy="${f(cy)}" r="${f(r)}" fill="none" stroke="${INK}" stroke-width="${f(LW*.7)}"/>`;
      for(let k=0;k<8;k++)ros+=`<ellipse cx="0" cy="${f(cy-r*.5)}" rx="${f(r*.18)}" ry="${f(r*.45)}" transform="rotate(${k*45} 0 ${f(cy)})" fill="none" stroke="${INK}" stroke-width="${f(LW*.6)}"/>`;
      o+=ros;
    }
  }
  if(s.ped==='col'){
    o+=R(-w*.28,-8,w*.56,8,m);
    o+=R(-w*.16,pedTop+5,w*.32,-8-pedTop-5,m);
    o+=R(-w*.22,pedTop,w*.44,5,m);
  }else{
    o+=P(`M${f(-w*.2)} ${f(pedTop)}L${f(w*.2)} ${f(pedTop)}Q${f(w*.06)} ${f(pedTop+w*.3)} 0 ${f(pedTop+w*.38)}Q${f(-w*.06)} ${f(pedTop+w*.3)} ${f(-w*.2)} ${f(pedTop)}Z`,m);
  }
  const wc=w*.38;
  if(s.shape==='square'){
    o+=R(-w/2,-rim,w,bh,m);
    o+=L(-w/2,-rim+7,w/2,-rim+7,INK,LW*.6);
    o+=R(-w/2+8,-rim+12,w-16,bh-20,'rgba(0,0,0,.05)',LW*.6);
  }else{
    o+=P(`M${f(-w/2)} ${f(-rim)}L${f(w/2)} ${f(-rim)}L${f(w/2)} ${f(-rim+6)}C${f(w*.49)} ${f(-rim+bh*.6)} ${f(w*.3)} ${f(pedTop)} ${f(wc/2)} ${f(pedTop)}L${f(-wc/2)} ${f(pedTop)}C${f(-w*.3)} ${f(pedTop)} ${f(-w*.49)} ${f(-rim+bh*.6)} ${f(-w/2)} ${f(-rim+6)}Z`,m);
    o+=L(-w/2,-rim+6,w/2,-rim+6,INK,LW*.6);
    if(s.shape==='flute'){
      for(let k=1;k<10;k++){const t=k/10,xa=-w/2+w*t,xb=-wc/2+wc*t;
        o+=`<path d="M${f(xa)} ${f(-rim+6)}Q${f(xa*.9)} ${f(-rim+bh*.65)} ${f(xb)} ${f(pedTop)}" fill="none" stroke="${INK}" stroke-width="${f(LW*.6)}" opacity=".65"/>`}
    }
  }
  if(+s.faucet){
    const fy=-(rim+(ph>0?Math.min(30,ph*.35):25));
    o+=L(0,fy+9,0,-rim+2,WATER,LW*2.2,'stroke-linecap="round" opacity=".8"');
    o+=`<circle cx="0" cy="${f(fy)}" r="6.5" fill="${BRASS}" stroke="${INK}" stroke-width="${f(LW)}"/>`;
    o+=R(-2.4,fy,4.8,9,BRASS);
  }
  o+=dimH(-w/2,w/2,S*.1,fmt(w))+dimV(0,-rim,pw/2+S*.09,fmt(rim));
  if(ph>0)o+=dimV(0,-(rim+ph),-pw/2-S*.07,fmt(rim+ph));
  return{svg:o,box:[-pw/2-S*.13,pw/2+S*.14,-(rim+ph)-S*.06,S*.15],
    stats:[['عرض الجرن',fmt(w)],['ارتفاع الحافة',fmt(rim)],['عمق الجرن',fmt(bh)],['الارتفاع مع اللوح',fmt(rim+ph)]],
    note:bh<+s.bowlH?'قلّلتُ العمق إلى '+fmt(bh)+' ليتناسب مع ارتفاع الحافة.':''};
}

/* ---------- facade ---------- */
function drawFacade(s){
  const W=+s.W,F=+s.floors,FH=+s.floorH,cols=+s.cols,ch=+s.cornice?40:0;
  const H=F*FH,Ht=H+ch,S=Math.max(W,Ht);setScale(S);
  const A=M(s.mat),B=M(s.mat2),ab=s.pattern==='ablaq',pl=+s.plinth?50:0;
  const J='rgba(30,25,20,.5)';
  let o=`<clipPath id="wallclip"><rect x="0" y="${-H}" width="${W}" height="${H}"/></clipPath>`,g='';
  if(s.pattern==='plain'){g+=`<rect x="0" y="${-H}" width="${W}" height="${H-pl}" fill="${A}"/>`}
  else{
    const cH=+s.course,sl=+s.slab;let y=pl,c=0;
    while(y<H){
      const hh=Math.min(cH,H-y),fill=ab&&c%2?B:A;
      g+=`<rect x="0" y="${f(-(y+hh))}" width="${W}" height="${f(hh)}" fill="${fill}"/>`;
      g+=L(0,-(y+hh),W,-(y+hh),J,LW*.5);
      const off=s.pattern==='grid'?0:(c%2)*sl/2;
      for(let x=off;x<W;x+=sl)if(x>0)g+=L(x,-y,x,-(y+hh),J,LW*.5);
      y+=hh;c++;
    }
  }
  if(pl){g+=`<rect x="0" y="${-pl}" width="${W}" height="${pl}" fill="${M('basalt')}"/>`;for(let x=100;x<W;x+=100)g+=L(x,0,x,-pl,'rgba(255,255,255,.25)',LW*.5);g+=L(0,-pl,W,-pl,INK,LW*.8)}
  o+=`<g clip-path="url(#wallclip)">${g}</g>`;
  o+=`<rect x="0" y="${-H}" width="${W}" height="${H}" fill="none" stroke="${INK}" stroke-width="${f(LW*1.4)}"/>`;
  if(+s.bands)for(let k=1;k<F;k++)o+=R(-4,-(k*FH+7),W+8,14,B);
  const dw=150,dh=Math.min(270,FH-40),door=+s.door;
  const wh=Math.max(60,Math.min(+s.wh,FH-120)),ww=Math.max(30,Math.min(+s.ww,W/cols-40));
  let open=0,count=0;
  for(let fl=0;fl<F;fl++){
    const sill=fl*FH+(fl===0?Math.max(90,pl+30):90);
    for(let i=0;i<cols;i++){
      const cx=W/cols*(i+.5);
      if(fl===0&&door&&Math.abs(cx-W/2)<dw/2+ww/2+25)continue;
      const top=-(sill+wh),bot=-sill;
      o+=P(shapePath(cx,ww+24,top-12,bot,s.win),B);
      o+=P(shapePath(cx,ww,top,bot,s.win),'#43525D');
      const sp=springY(ww,top,bot,s.win);
      o+=L(cx,bot,cx,s.win==='rect'?top:sp,'#C9D2D8',LW*.8);
      o+=L(cx-ww/2,sp,cx+ww/2,sp,'#C9D2D8',LW*.8);
      o+=R(cx-ww/2-20,bot,ww+40,9,B);
      open+=ww*wh;count++;
    }
  }
  if(door){
    const dx=W/2;
    o+=P(shapePath(dx,dw+30,-(dh+15),0,s.win),B);
    o+=P(shapePath(dx,dw,-dh,0,s.win),'#5B3F2C');
    o+=L(dx,0,dx,-dh*.8,'#2E2018',LW);
    o+=R(dx-dw/2+14,-dh*.55,dw/2-24,dh*.4,'none',LW*.6)+R(dx+10,-dh*.55,dw/2-24,dh*.4,'none',LW*.6);
    open+=dw*dh;
  }
  if(ch){o+=R(-6,-(H+ch*.55),W+12,ch*.55,B);o+=R(-16,-Ht,W+32,ch*.45,B)}
  o+=dimH(0,W,S*.08,fmt(W))+dimV(0,-Ht,W+S*.08,fmt(Ht))+dimV(0,-FH,-S*.06,fmt(FH));
  const tot=W*H/1e4,op=open/1e4;
  return{svg:o,box:[-S*.12,W+S*.13,-Ht-S*.05,S*.13],
    stats:[['مساحة الواجهة',tot.toFixed(1)+' م²'],['مساحة الفتحات',op.toFixed(1)+' م²'],['مساحة التغليف التقريبية',(tot-op).toFixed(1)+' م²'],['عدد الشبابيك',count]],
    note:(+s.ww>ww||+s.wh>wh)?'صغّرتُ الشبابيك لتتسع في الواجهة.':''};
}

/* stone courses helper */
function coursesBlock(id,x,y,w,h,fill,cH=40,sl=80){
  let g=`<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" fill="${fill}"/>`,c=0;
  for(let yy=y+h;yy>y;yy-=cH,c++){
    g+=L(x,yy,x+w,yy,'rgba(30,25,20,.35)',LW*.5);
    const off=(c%2)*sl/2;
    for(let xx=x+off;xx<x+w;xx+=sl)if(xx>x)g+=L(xx,yy,xx,Math.max(y,yy-cH),'rgba(30,25,20,.35)',LW*.5);
  }
  return `<clipPath id="${id}"><rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}"/></clipPath><g clip-path="url(#${id})">${g}</g>`;
}

/* ---------- window ---------- */
function drawWindow(s){
  const ow=+s.ow,oh=+s.oh,fr=+s.fr,pil=+s.pil,key=+s.key,top=s.top;
  const pw=pil?Math.max(14,fr*1.2):0;
  const hw=ow/2+fr+pw+10;
  const crownH=s.crown==='none'?0:(s.crown==='tri'?hw*.38+12:s.crown==='seg'?hw*.28+12:20);
  const frameTop=-(oh+fr);
  const wallX=hw+60,wallTop=frameTop-crownH-(key?fr*.4:0)-60,wallBot=70;
  const S=Math.max(wallX*2,wallBot-wallTop);setScale(S);
  const m=M(s.mat);let o='';
  o+=coursesBlock('wallw',-wallX,wallTop,wallX*2,wallBot-wallTop,M(s.wall));
  o+=`<rect x="${f(-wallX)}" y="${f(wallTop)}" width="${f(wallX*2)}" height="${f(wallBot-wallTop)}" fill="none" stroke="${INK}" stroke-width="${f(LW)}"/>`;
  if(pil)for(const sd of[-1,1]){
    const x=sd>0?ow/2+fr:-(ow/2+fr)-pw;
    o+=R(x,frameTop,pw,-frameTop,m);
    o+=R(x-3,frameTop,pw+6,7,m)+R(x-3,-7,pw+6,7,m);
    o+=L(x+pw/2,frameTop+12,x+pw/2,-12,INK,LW*.5);
  }
  o+=P(shapePath(0,ow+2*fr,frameTop,0,top),m);
  o+=P(shapePath(0,ow+fr*.7,-(oh+fr*.35),0,top),'none',LW*.5);
  o+=`<clipPath id="glass"><path d="${shapePath(0,ow,-oh,0,top)}"/></clipPath>`;
  o+=P(shapePath(0,ow,-oh,0,top),'#43525D');
  const sp=springY(ow,-oh,0,top);
  let gl=L(0,0,0,top==='rect'?-oh:sp,'#C9D2D8',LW)+L(-ow/2,sp,ow/2,sp,'#C9D2D8',LW);
  if(+s.grill){for(let x=-ow/2+ow/6;x<ow/2;x+=ow/6)gl+=L(x,0,x,-oh,'#1C1C1C',LW*1.1);for(let y=-15;y>-oh;y-=22)gl+=L(-ow/2,y,ow/2,y,'#1C1C1C',LW*.8)}
  o+=`<g clip-path="url(#glass)">${gl}</g>`;
  if(key){
    const kt=frameTop-fr*.4,kb=top==='rect'?-oh:-oh+2;
    o+=P(`M${f(-fr*.9)} ${f(kt)}L${f(fr*.9)} ${f(kt)}L${f(fr*.55)} ${f(kb)}L${f(-fr*.55)} ${f(kb)}Z`,m);
  }
  const yc=frameTop-(key?fr*.4:0);
  if(s.crown!=='none'){
    o+=R(-hw,yc-10,hw*2,10,m);
    if(s.crown==='flat')o+=R(-hw-6,yc-20,hw*2+12,10,m);
    if(s.crown==='tri'){const a=yc-10-hw*.38;o+=P(`M${f(-hw-6)} ${f(yc-10)}L0 ${f(a)}L${f(hw+6)} ${f(yc-10)}Z`,m)+P(`M${f(-hw+18)} ${f(yc-14)}L0 ${f(a+10)}L${f(hw-18)} ${f(yc-14)}Z`,'none',LW*.5)}
    if(s.crown==='seg'){o+=P(`M${f(-hw-6)} ${f(yc-10)}Q0 ${f(yc-10-hw*.56)} ${f(hw+6)} ${f(yc-10)}Z`,m)}
  }
  o+=R(-hw,0,hw*2,10,m)+R(-hw+8,10,hw*2-16,4,m);
  o+=dimH(-ow/2,ow/2,wallBot+S*.06,fmt(ow))+dimH(-hw,hw,wallBot+S*.14,fmt(hw*2));
  o+=dimV(0,-oh,wallX+S*.06,fmt(oh));
  const area=((ow+2*fr)*(oh+fr)-ow*oh+2*pw*(oh+fr)+hw*2*(14+crownH*.6))/1e4;
  return{svg:o,noGround:true,box:[-wallX-S*.05,wallX+S*.12,wallTop-S*.04,wallBot+S*.19],
    stats:[['فتحة الشباك',ow+' × '+oh+' سم'],['العرض الكلي للإطار',fmt(hw*2)],['عرض الحلق',fr+' سم'],['حجر الإطار تقريباً',area.toFixed(2)+' م²']],note:''};
}

/* ---------- fireplace ---------- */
function drawFireplace(s){
  const W=+s.W,H=+s.H,st=s.style,ov=+s.overH;
  const ow=Math.min(+s.ow,W-40),oh=Math.min(+s.oh,H-30);
  const Ht=H+ov,S=Math.max(W+40,Ht);setScale(S);
  const m=M(s.mat),m2=M(s.mat2);let o='';
  if(ov>0){
    const pw=st==='modern'?W:W*.82;
    o+=R(-pw/2,-Ht,pw,ov,m);
    if(st!=='modern')o+=R(-pw/2+12,-Ht+12,pw-24,ov-24,'none',LW*.6);
    else{o+=L(0,-Ht,0,-H,'rgba(30,25,20,.35)',LW*.6)}
  }
  if(st==='modern'){
    o+=R(-W/2,-H,W,H,m);
    const sx=(W-ow)/2;
    o+=L(-ow/2,-H,-ow/2,-oh,'rgba(30,25,20,.4)',LW*.6)+L(ow/2,-H,ow/2,-oh,'rgba(30,25,20,.4)',LW*.6);
  }else{
    const leg=Math.max(18,(W-ow)/2*.7);
    o+=R(-W/2,-H+8,W,H-8,m);
    for(const sd of[-1,1]){const x=sd<0?-W/2:W/2-leg;o+=R(x+4,-oh,leg-8,oh,'none',LW*.5);o+=R(x-2,-H+8,leg+4,9,m)}
    o+=R(-W*.14,-H+16,W*.28,Math.max(10,(H-oh)-28),'none',LW*.6);
    o+=R(-W/2-10,-H,W+20,9,m);
    o+=R(-W/2-3,-12,W+6,12,m);
  }
  const shape=st==='arched'?'round':'rect';
  o+=P(shapePath(0,ow+14,-(oh+7),0,shape),m2);
  o+=P(shapePath(0,ow,-oh,0,shape),'#2A2422');
  if(+s.fire){
    o+=R(-ow*.3,-9,ow*.6,7,'#5A3A26')+R(-ow*.22,-15,ow*.44,6,'#6B4630');
    const fh=Math.min(oh*.55,40);
    for(const [x,h,c] of [[-ow*.12,fh*.8,'#E0782F'],[0,fh,'#F0A03A'],[ow*.12,fh*.7,'#E0782F'],[0,fh*.55,'#F7D36A']])
      o+=`<path d="M${f(x-ow*.08)} -14Q${f(x-ow*.09)} ${f(-14-h*.5)} ${f(x)} ${f(-14-h)}Q${f(x+ow*.09)} ${f(-14-h*.5)} ${f(x+ow*.08)} -14Z" fill="${c}" opacity=".9"/>`;
  }
  if(+s.hearth)o+=R(-W/2-20,-5,W+40,5,m2);
  o+=dimH(-W/2,W/2,S*.08,fmt(W))+dimH(-ow/2,ow/2,S*.15,fmt(ow));
  o+=dimV(0,-H,W/2+20+S*.06,fmt(H))+dimV(0,-oh,-W/2-20-S*.05,fmt(oh));
  if(ov>0)o+=dimV(0,-Ht,W/2+20+S*.13,fmt(Ht));
  const area=(W*H-ow*oh+(ov>0?(st==='modern'?W:W*.82)*ov:0))/1e4;
  return{svg:o,box:[-W/2-20-S*.11,W/2+20+S*(ov>0?.17:.11),-Ht-S*.05,S*.19],
    stats:[['المقاس الكلي',W+' × '+Ht+' سم'],['فتحة النار',ow+' × '+oh+' سم'],['مساحة التلبيس تقريباً',area.toFixed(2)+' م²']],
    note:(ow<+s.ow||oh<+s.oh)?'صغّرتُ فتحة النار لتتسع ضمن الإطار.':''};
}

/* ---------- stairs ---------- */
function drawStairs(s){
  const n=+s.n,r=+s.r,t=+s.t,nose=+s.nose,wd=+s.wd;
  const run=n*t,rise=n*r,S=Math.max(run+70,rise);setScale(S);
  const mt=M(s.mat),mr=M(s.mat2);let o='';
  let d='M0 0';for(let i=1;i<=n;i++)d+=`L${f((i-1)*t)} ${f(-i*r)}L${f(i*t)} ${f(-i*r)}`;
  d+=`L${f(run+60)} ${f(-rise)}L${f(run+60)} ${f(-rise+25)}L${f(run)} ${f(-rise+25)}L30 0Z`;
  o+=P(d,'#CFCFCA',LW*.8);
  for(let i=1;i<=n;i++){
    o+=R((i-1)*t,-i*r+3,2,r-3,mr);
    o+=R((i-1)*t-nose,-i*r,t+nose,3,mt);
  }
  o+=R(run-nose,-rise,60+nose,3,mt);
  o+=dimH(0,run,S*.08,fmt(run))+dimV(0,-rise,run+60+S*.06,fmt(rise))+dimV(0,-r,-nose-S*.04,r+' سم');
  o+=dimH(t,2*t,-r*2-S*.05,t+' سم');
  const bl=2*r+t;
  return{svg:o,box:[-nose-S*.1,run+60+S*.12,-rise-S*.06,S*.14],
    stats:[['الارتفاع الكلي',fmt(rise)],['الطول الأفقي',fmt(run)],['مساحة الدعسات',(n*(t+nose)*wd/1e4).toFixed(2)+' م²'],['مساحة القوائم',(n*r*wd/1e4).toFixed(2)+' م²']],
    note:`مقياس الراحة: ضعف القائمة + الدعسة = ${bl} سم `+(bl>=60&&bl<=65?'(مريح)':'(المريح بين 60 و65 سم)')};
}

/* ---------- floor (plan) ---------- */
function drawFloor(s){
  const RW=+s.RW,RL=+s.RL,b=+s.border?+s.bw:0,pat=s.pat;
  const [tw,th]=s.tile.split('x').map(Number).concat([]);const TH=th||tw;
  const S=Math.max(RW,RL)+30;setScale(S);
  const A=M(s.mat),B=M(s.mat2),J='rgba(30,25,20,.45)',jw=LW*.5;
  let o=R(-15,-15,RW+30,RL+30,'#3A3F44');
  o+=`<rect x="0" y="0" width="${RW}" height="${RL}" fill="${b?B:A}"/>`;
  const fx=b,fy=b,fw=RW-2*b,fl=RL-2*b;
  let g='',count=0;
  const tile=(x,y,w,h,fill)=>{g+=`<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" fill="${fill}" stroke="${J}" stroke-width="${f(jw)}"/>`;count++};
  if(pat==='diag'||pat==='diagchess'){
    const D=Math.hypot(fw,fl),cx=fx+fw/2,cy=fy+fl/2;let rows='';
    const save=g;g='';
    for(let y=-D/2,j=0;y<D/2;y+=tw,j++)for(let x=-D/2,i=0;x<D/2;x+=tw,i++)tile(cx+x,cy+y,tw,tw,pat==='diagchess'&&(i+j)%2?B:A);
    rows=g;g=save+`<g transform="rotate(45 ${f(cx)} ${f(cy)})">${rows}</g>`;
  }else if(pat==='basket'){
    for(let y=fy,j=0;y<fy+fl;y+=tw,j++)for(let x=fx,i=0;x<fx+fw;x+=tw,i++){
      if((i+j)%2){tile(x,y,tw/2,tw,A);tile(x+tw/2,y,tw/2,tw,A)}else{tile(x,y,tw,tw/2,A);tile(x,y+tw/2,tw,tw/2,A)}
    }
  }else{
    for(let y=fy,j=0;y<fy+fl;y+=TH,j++){
      const off=pat==='offset'&&j%2?-tw/2:0;
      for(let x=fx+off,i=0;x<fx+fw;x+=tw,i++)tile(x,y,tw,TH,pat==='chess'&&(i+j)%2?B:A);
    }
  }
  o+=`<clipPath id="field"><rect x="${fx}" y="${fy}" width="${fw}" height="${fl}"/></clipPath><g clip-path="url(#field)">${g}</g>`;
  if(b)o+=`<rect x="${fx}" y="${fy}" width="${fw}" height="${fl}" fill="none" stroke="${INK}" stroke-width="${f(LW*.8)}"/>`;
  if(+s.med){
    const cx=RW/2,cy=RL/2,rr=Math.min(fw,fl)*.22;
    o+=`<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(rr)}" fill="${B}" stroke="${INK}" stroke-width="${f(LW)}"/>`;
    const q=rr*.62;
    for(const a of[0,45])o+=`<rect x="${f(cx-q)}" y="${f(cy-q)}" width="${f(q*2)}" height="${f(q*2)}" transform="rotate(${a} ${f(cx)} ${f(cy)})" fill="${A}" stroke="${INK}" stroke-width="${f(LW*.7)}"/>`;
    o+=`<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(rr*.32)}" fill="${B}" stroke="${INK}" stroke-width="${f(LW*.7)}"/>`;
  }
  o+=`<rect x="0" y="0" width="${RW}" height="${RL}" fill="none" stroke="${INK}" stroke-width="${f(LW*1.4)}"/>`;
  o+=dimH(0,RW,RL+15+S*.06,fmt(RW))+dimV(RL,0,RW+15+S*.06,fmt(RL));
  const area=RW*RL/1e4,farea=fw*fl,waste=pat.startsWith('diag')?1.15:1.1;

  if(b)st.push(['طول الإطار',(2*(RW+RL-2*b)/100).toFixed(2)+' م.ط']);
  return{svg:o,noGround:true,box:[-15-S*.04,RW+15+S*.12,-15-S*.04,RL+15+S*.12],stats:st,
    note:'الهدر محسوب '+(waste===1.15?'15٪ للتركيب القطري':'10٪')+'.'};

async function makePNG(){
  await document.fonts.ready;
  const svg=$('draw'),vb=svg.viewBox.baseVal,W=1600,dh=Math.round(W*vb.height/vb.width);
  const clone=svg.cloneNode(true);clone.setAttribute('width',W);clone.setAttribute('height',dh);
  const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(clone));
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const head=150,stats=[...$('stats').children].map(d=>[d.querySelector('dt').textContent,d.querySelector('dd').textContent]);
  const note=$('note').textContent,foot=170+(note?50:0),pad=50;
  const c=document.createElement('canvas');c.width=W+pad*2;c.height=head+dh+foot+pad;
  const x=c.getContext('2d');x.fillStyle='#F8F7F3';x.fillRect(0,0,c.width,c.height);
  x.strokeStyle='#2B3238';x.lineWidth=3;x.strokeRect(18,18,c.width-36,c.height-36);
  x.direction='rtl';x.textAlign='right';x.fillStyle='#20272D';
  const F='"Noto Kufi Arabic",Tahoma,sans-serif';
  x.font='800 50px '+F;x.fillText($('company').value.trim()||SCHEMAS[tab].title,c.width-pad,95);
  x.font='400 30px '+F;x.fillStyle='#5D656B';x.fillText($('tProject').textContent,c.width-pad,140);
  x.fillStyle='#2B3238';x.fillRect(pad,head+5,W,3);
  x.drawImage(img,pad,head+20,W,dh);
  const y0=head+dh+40;x.fillRect(pad,y0,W,3);
  const cw=W/Math.max(1,stats.length);
  stats.forEach(([k,v],i)=>{const rx=c.width-pad-i*cw-14;x.fillStyle='#5D656B';x.font='400 26px '+F;x.fillText(k,rx,y0+50);x.fillStyle='#20272D';x.font='800 38px '+F;x.fillText(v,rx,y0+105)});
  if(note){x.fillStyle='#8A3B22';x.font='400 26px '+F;x.fillText(note,c.width-pad,y0+160)}
  return await new Promise(r=>c.toBlob(r,'image/png'));
}

async function saveBlob(blob){

  if(isIOS&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});return true}catch(e){if(e.name==='AbortError')return false}
  }

  a.href=u;a.download=fileName();document.body.appendChild(a);a.click();a.remove();

      body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',temperature:.4}})});
    const d=await r.json();
    if(!r.ok)throw{code:r.status===429?'quota':'api',message:(d.error&&d.error.message)||r.status};
    t=((d.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||'').join('');
  }else{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model,max_tokens:800,messages:[{role:'user',content:prompt}]})});
    const d=await r.json();
    if(!r.ok)throw{code:'api',message:(d.error&&d.error.message)||r.status};
    t=d.content.map(c=>c.text||'').join('');
  }
  t=t.replace(/```json|```/g,'').trim();
  return JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));
}
function applyAI(res){
  const tk=SCHEMAS[res.tab]?res.tab:tab,set=res.set||{};let n=0;
  undoStack.push({tab,st:JSON.parse(JSON.stringify(state))});
  for(const [id,raw] of Object.entries(set)){
    const c=SCHEMAS[tk].controls.find(x=>x.id===id);if(!c)continue;
    if(c.type==='range'){let v=+raw;if(isNaN(v))continue;v=Math.min(c.max,Math.max(c.min,Math.round(v/c.step)*c.step));state[tk][id]=v;n++}
    else if(c.type==='seg'){const o=c.options.find(o=>String(o[0])===String(raw)||o[1]===raw);if(o){state[tk][id]=String(o[0]);n++}}
    else{const k=MATS[raw]?raw:Object.keys(MATS).find(k=>MATS[k].name===raw);if(k){state[tk][id]=k;n++}}
  }
  if(!n&&tk===tab){undoStack.pop()}
  else{tab=tk;buildPanel();render();updTitle()}
  $('aiUndo').disabled=!undoStack.length;
}
const errText=e=>({not_granted:'لازم توافق على استعمال الذكاء الاصطناعي لما يطلب منك.',rate_limited:'كتير طلبات ورا بعض، استنى شوي وجرّب.',nokey:'حط المفتاح من الإعدادات أول.',quota:'خلص الحد المجاني لهلق، جرّب بعد شوي أو بكرة.',api:'في مشكلة بالمفتاح أو الحساب: '+(e.message||'')}[e.code]||'ما فهمت الرد، جرّب تكتب الطلب بطريقة تانية.');
async function runAI(){
  const msg=$('aiIn').value.trim();if(!msg)return;
  const out=$('aiOut');out.classList.remove('err');out.textContent='عم فكّر...';$('aiGo').disabled=true;
  try{
    const res=await callAI(buildPrompt(msg));
    applyAI(res);out.textContent=res.reply||'تم.';hist.push({u:msg,a:res.reply||''});$('aiIn').value='';
  }catch(e){out.classList.add('err');out.textContent=errText(e||{})}
  $('aiGo').disabled=false;
}
$('aiGo').onclick=runAI;
$('aiIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();runAI()}});
$('aiUndo').onclick=()=>{const u=undoStack.pop();if(!u)return;Object.assign(state,u.st);tab=u.tab;buildPanel();render();updTitle();$('aiUndo').disabled=!undoStack.length;$('aiOut').textContent='رجّعت التعديل.'};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
buildPanel();render();updTitle();
</script>
