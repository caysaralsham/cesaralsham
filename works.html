<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أعمالنا | قيصر الشام للحجر والرخام</title>
<meta name="description" content="معرض أعمال قيصر الشام للحجر والرخام — شمينة، جرن حمام، سبالة، تابلوهات أرضية وحائطية وأعمدة منحوتة. Galerie de nos réalisations en marbre et pierre naturelle.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#111111; --gold:#B88A2A; --gold-deep:#8F6A1F; --cream:#FFFFFF; --cream-2:#FAF9F7;
    --text-dim:#666666; --line:#ECE8E0; --shadow:0 10px 30px rgba(17,17,17,.06);
    --radius:20px;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Cairo','Tajawal',sans-serif; background:var(--cream); color:#1A1A1A; direction:rtl; line-height:1.6;}
  a{text-decoration:none; color:inherit;}
  img{max-width:100%; display:block;}

  header{background:var(--ink); position:sticky; top:0; z-index:50;}
  .header-inner{max-width:1280px; margin:0 auto; padding:16px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px;}
  .brand{display:flex; align-items:center; gap:10px; color:var(--gold); font-weight:800; font-size:18px;}
  nav a{color:#cfc6ac; font-size:14px; font-weight:700; margin-inline-start:20px;}
  nav a:hover, nav a.home-link:hover{color:var(--gold);}

  .page-head{max-width:1280px; margin:0 auto; padding:56px 24px 24px; text-align:center;}
  .page-head h1{font-size:clamp(26px,4vw,38px); font-weight:900; margin:0 0 10px;}
  .page-head h1 span{color:var(--gold-deep);}
  .page-head p{color:var(--text-dim); font-size:14.5px; margin:0;}

  .filters{max-width:1280px; margin:0 auto; padding:0 24px 32px; display:flex; flex-wrap:wrap; gap:10px; justify-content:center;}
  .filter-btn{background:var(--cream-2); border:1.5px solid var(--line); color:var(--ink); padding:9px 20px; border-radius:999px; font-size:13.5px; font-weight:700; cursor:pointer; transition:.2s;}
  .filter-btn:hover{border-color:var(--gold);}
  .filter-btn.active{background:var(--gold); border-color:var(--gold); color:#fff;}

  .gallery-grid{max-width:1280px; margin:0 auto; padding:0 24px 80px; display:grid; grid-template-columns:repeat(4,1fr); gap:22px;}
  .card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); cursor:pointer; transition:.3s ease; display:flex; flex-direction:column;}
  .card:hover{transform:translateY(-5px); box-shadow:0 20px 40px rgba(17,17,17,.12);}
  .card .img-wrap{aspect-ratio:4/3; overflow:hidden; background:var(--cream-2);}
  .card .img-wrap img{width:100%; height:100%; object-fit:cover; transition:.4s ease;}
  .card:hover .img-wrap img{transform:scale(1.06);}
  .card .body{padding:14px 16px;}
  .card .title{font-weight:700; font-size:14.5px; margin-bottom:4px;}
  .card .meta{font-size:12px; color:var(--text-dim);}

  .empty-state{grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--text-dim); font-size:14px;}

  footer{background:#0c0c0c; color:#8a8270; text-align:center; padding:26px; font-size:12.5px; margin-top:40px;}
  footer b{color:var(--gold);}

  .lightbox-overlay{position:fixed; inset:0; background:rgba(20,17,13,.92); z-index:300; display:none; align-items:center; justify-content:center; padding:20px; cursor:zoom-out;}
  .lightbox-overlay.show{display:flex;}
  .lightbox-close{position:absolute; top:18px; left:24px; color:#fff; font-size:34px; cursor:pointer; z-index:2;}
  .lightbox-overlay img{max-width:92%; max-height:88vh; border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,.5);}

  @media (max-width:960px){
    .gallery-grid{grid-template-columns:repeat(2,1fr);}
    nav a{margin-inline-start:14px; font-size:13px;}
  }
  @media (max-width:520px){
    .gallery-grid{grid-template-columns:1fr; gap:16px;}
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="brand home-link" href="index.html">قيصر الشام</a>
    <nav>
      <a href="index.html">الرئيسية</a>
      <a href="index.html#about">من نحن</a>
      <a href="index.html#contact">تواصل معنا</a>
    </nav>
  </div>
</header>

<div class="page-head">
  <h1>أعمالنا في <span>الحجر والرخام</span></h1>
  <p>تصفّح مجموعة من أعمالنا المنجزة — دوس على أي صورة لعرضها بحجم أكبر</p>
</div>

<div class="filters" id="filters"></div>

<div class="gallery-grid" id="galleryGrid">
  <div class="empty-state">جاري تحميل الأعمال...</div>
</div>

<footer>
  <b>قيصر الشام للحجر والرخام</b> — جميع الحقوق محفوظة © 2026
</footer>

<div class="lightbox-overlay" id="lightboxOverlay">
  <span class="lightbox-close" id="lightboxClose">×</span>
  <img id="lightboxImg" src="">
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDi1Pn7guMnyc0CetV8Z9IUC-k0gtav2_8",
  authDomain: "basel-7b29b.firebaseapp.com",
  projectId: "basel-7b29b",
  storageBucket: "basel-7b29b.firebasestorage.app",
  messagingSenderId: "1025769465563",
  appId: "1:1025769465563:web:53b5c9949dbb26364d8efe"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const FS_COLLECTION = 'cesar_website';
const CHUNK_PREFIX = 'items_';

let items = [];
let activeCategory = 'all';

// لو الرابط جاي من القائمة المنسدلة بـ index.html بشكل works.html?category=اسم_القسم
const params = new URLSearchParams(location.search);
const initialCategory = params.get('category');
if(initialCategory) activeCategory = initialCategory;

function renderFilters(){
  const cats = [...new Set(items.map(it => (it.category||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));
  const wrap = document.getElementById('filters');
  if(!cats.length){ wrap.innerHTML = ''; return; }
  const allBtn = `<button class="filter-btn ${activeCategory==='all'?'active':''}" data-cat="all">الكل</button>`;
  const catBtns = cats.map(c => `<button class="filter-btn ${activeCategory===c?'active':''}" data-cat="${c}">${c}</button>`).join('');
  wrap.innerHTML = allBtn + catBtns;
  wrap.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeCategory = btn.dataset.cat;
      renderFilters();
      renderGallery();
    });
  });
}

function renderGallery(){
  const grid = document.getElementById('galleryGrid');
  const filtered = activeCategory === 'all' ? items : items.filter(it => (it.category||'').trim() === activeCategory);
  if(!filtered.length){
    grid.innerHTML = '<div class="empty-state">لا توجد صور بهذا القسم بعد.</div>';
    return;
  }
  grid.innerHTML = filtered.map(it => `
    <div class="card" onclick="openLightbox('${it.img}')">
      <div class="img-wrap"><img src="${it.img}" loading="lazy" alt="${(it.title||it.category||'رخام وحجر طبيعي')} - قيصر الشام"></div>
      <div class="body">
        <div class="title">${it.title || it.category || 'قطعة رخام وحجر'}</div>
        <div class="meta">${[it.category, it.size, it.color].filter(Boolean).join(' · ')}</div>
      </div>
    </div>
  `).join('');
}

function openLightbox(imgUrl){
  document.getElementById('lightboxImg').src = imgUrl;
  document.getElementById('lightboxOverlay').classList.add('show');
}
function closeLightbox(){
  document.getElementById('lightboxOverlay').classList.remove('show');
}
document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
document.getElementById('lightboxOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'lightboxOverlay') closeLightbox();
});

db.collection(FS_COLLECTION).onSnapshot((snap)=>{
  let combined = [];
  snap.forEach(doc=>{
    if(doc.id.startsWith(CHUNK_PREFIX)) combined = combined.concat(doc.data().items || []);
  });
  combined.sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));
  items = combined;
  renderFilters();
  renderGallery();
}, (err)=>{
  console.error(err);
  document.getElementById('galleryGrid').innerHTML = '<div class="empty-state">تعذر تحميل الأعمال حاليًا، حاول تحديث الصفحة.</div>';
});
</script>
</body>
</html>
