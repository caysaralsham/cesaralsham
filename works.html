<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أعمالنا | قيصر الشام للحجر والرخام</title>
<meta name="description" content="تصفح كل أعمالنا من الحجر والرخام: شمينة، جرن حمام، سبالة، تابلوهات أرضية وحائطية - قيصر الشام للحجر والرخام، الجزائر.">
<meta property="og:title" content="أعمالنا | قيصر الشام للحجر والرخام">
<meta property="og:description" content="تصفح مجموعتنا الكاملة من أعمال الحجر والرخام في الجزائر.">
<meta property="og:type" content="website">
<meta property="og:locale" content="ar_DZ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#111111; --gold:#B88A2A; --gold-deep:#8F6A1F; --cream:#FFFFFF; --cream-2:#FAF9F7;
    --stone:#1A1A1A; --text-dim:#666666; --line:#ECE8E0; --white:#FFFFFF; --danger:#A6453D;
    --radius:20px; --radius-sm:16px; --shadow:0 10px 30px rgba(17,17,17,.06);
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Cairo','Tajawal',sans-serif; background:var(--cream); color:#1A1A1A; direction:rtl; line-height:1.6;}
  img{max-width:100%; display:block;}
  a{text-decoration:none; color:inherit;}

  header{background:rgba(17,17,17,.98); position:sticky; top:0; z-index:50;}
  .header-inner{max-width:1280px; margin:0 auto; min-height:100px; display:flex; align-items:center; justify-content:space-between; gap:20px; padding-inline:24px;}
  .brand{display:flex; align-items:center; gap:14px;}
  .brand .name{color:var(--gold); font-size:22px; font-weight:800;}
  .brand .sub{color:#fff; font-size:12.5px; margin-top:2px; opacity:.85;}
  nav{display:flex; align-items:center; gap:28px;}
  nav a{position:relative; color:#fff; font-size:15px; font-weight:700; transition:.25s; padding-bottom:8px;}
  nav a:hover{color:var(--gold);}
  nav a.active{color:var(--gold);}
  nav a.active::after{content:""; position:absolute; right:0; left:0; bottom:0; height:2px; background:var(--gold); border-radius:2px;}
  .burger{display:none; color:#fff; font-size:22px; background:none; border:none; cursor:pointer;}

  .page-head{max-width:1280px; margin:0 auto; padding:56px 24px 8px; text-align:center;}
  .page-head h1{font-size:clamp(26px,3.6vw,38px); font-weight:900; margin:0 0 12px;}
  .page-head .rule{width:60px; height:3px; background:var(--gold); margin:0 auto; border-radius:2px;}
  .page-head p{color:var(--text-dim); font-size:14.5px; margin-top:14px;}

  .filters{max-width:1280px; margin:36px auto 0; padding-inline:24px; display:flex; flex-wrap:wrap; gap:10px; justify-content:center;}
  .filters button{background:transparent; border:1.5px solid var(--gold); color:var(--gold-deep); padding:9px 20px; border-radius:14px; font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer; transition:.25s;}
  .filters button.active, .filters button:hover{background:var(--gold); color:#fff;}

  .section{max-width:1280px; margin:0 auto; padding-block:56px 96px; padding-inline:24px;}
  .gallery-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:30px; align-items:stretch;}
  .card{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); transition:.35s ease; display:flex; flex-direction:column; height:100%;}
  .card:hover{transform:translateY(-6px); box-shadow:0 22px 44px rgba(17,17,17,.12);}
  .card .img-wrap{aspect-ratio:4/3; overflow:hidden; background:var(--cream-2); flex-shrink:0;}
  .card .img-wrap img{width:100%; height:100%; object-fit:cover; transition:.45s ease;}
  .card:hover .img-wrap img{transform:scale(1.06);}
  .card .body{padding:18px 20px; flex:1; display:flex; flex-direction:column; min-height:96px;}
  .card .title{font-weight:700; font-size:15px; margin-bottom:6px; color:#111;}
  .card .meta{font-size:12.5px; color:var(--text-dim); line-height:1.9;}
  .card .meta b{color:var(--ink);}
  .empty-gallery{grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--text-dim); font-size:14px;}

  .btn{display:inline-flex; align-items:center; gap:8px; background:var(--gold); color:#fff; padding:12px 26px; border-radius:14px; font-size:14px; font-weight:700; border:none; cursor:pointer; transition:.3s ease;}
  .btn:hover{background:var(--gold-deep);}
  .btn-outline{background:transparent; border:1.5px solid var(--gold); color:var(--gold-deep);}
  .btn-outline:hover{background:var(--gold); color:#fff;}

  .pagination{display:flex; justify-content:center; align-items:center; gap:8px; margin-top:50px; flex-wrap:wrap;}
  .pagination button{width:40px; height:40px; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--stone); font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer; transition:.2s;}
  .pagination button.active{background:var(--gold); border-color:var(--gold); color:#fff;}
  .pagination button:hover:not(.active):not(:disabled){border-color:var(--gold); color:var(--gold-deep);}
  .pagination button:disabled{opacity:.4; cursor:not-allowed;}

  footer{background:#0c0c0c; color:#8a8270; text-align:center; padding:26px; font-size:12.5px;}
  footer b{color:var(--gold);}
  footer a{color:var(--gold);}

  @media (max-width:820px){
    .header-inner{flex-wrap:wrap; padding-block:16px;}
    nav{display:none; width:100%; flex-direction:column; align-items:flex-start; gap:14px; order:3;}
    nav.open{display:flex;}
    .burger{display:block; order:2;}
    .gallery-grid{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:520px){
    .gallery-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <button class="burger" id="burgerBtn" aria-label="القائمة">☰</button>
    <nav id="navWrap">
      <a href="index.html">الرئيسية</a>
      <a href="works.html" class="active">أعمالنا</a>
      <a href="index.html#about">من نحن</a>
      <a href="index.html#contact">تواصل معنا</a>
    </nav>
    <a class="brand" href="index.html">
      <div>
        <div class="name">قيصر الشام</div>
        <div class="sub">للحجر والرخام · الجزائر</div>
      </div>
    </a>
  </div>
</header>

<div class="page-head">
  <h1>أعمالنا</h1>
  <div class="rule"></div>
  <p>تصفح مجموعتنا الكاملة من الحجر والرخام — فلتر حسب القسم اللي يهمك</p>
</div>

<div class="filters" id="categoryFilters"></div>

<section class="section">
  <div class="gallery-grid" id="galleryGrid">
    <div class="empty-gallery">جاري التحميل...</div>
  </div>
  <div class="pagination" id="pagination"></div>
</section>

<footer>
  <div>© <span id="year"></span> <b>قيصر الشام</b> للحجر والرخام — جميع الحقوق محفوظة</div>
  <div style="margin-top:6px;"><a href="index.html">العودة للصفحة الرئيسية</a></div>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

const firebaseConfig = {
  apiKey: "AIzaSyDi1Pn7guMnyc0CetV8Z9IUC-k0gtav2_8",
  authDomain: "basel-7b29b.firebaseapp.com",
  projectId: "basel-7b29b",
  storageBucket: "basel-7b29b.firebasestorage.app",
  messagingSenderId: "1025769465563",
  appId: "1:1025769465563:web:53b5c9949dbb26364d8efe"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

(function trackVisit(){
  const today = new Date().toISOString().slice(0,10);
  const docRef = db.collection('cesar_stats').doc(today);
  docRef.set({
    date: today,
    count: firebase.firestore.FieldValue.increment(1)
  }, {merge:true}).catch(()=>{});

  fetch('https://ipapi.co/json/')
    .then(r => r.json())
    .then(geo => {
      const code = (geo && geo.country_code) ? geo.country_code : 'XX';
      return docRef.set({
        countries: { [code]: firebase.firestore.FieldValue.increment(1) }
      }, {merge:true});
    })
    .catch(()=>{});
})();

const FS_COLLECTION = 'cesar_website';
const CHUNK_PREFIX = 'items_';

let items = [];
let activeCategory = 'all';
let currentPage = 1;
const PAGE_SIZE = 12;

// دعم رابط ?category=اسم القسم قادم من القائمة الرئيسية
const params = new URLSearchParams(location.search);
if(params.get('category')) activeCategory = params.get('category');

db.collection(FS_COLLECTION).onSnapshot((snap)=>{
  const itemChunks = {};
  snap.forEach(doc=>{
    if(doc.id.startsWith(CHUNK_PREFIX)) itemChunks[doc.id] = doc.data().items || [];
  });
  let combined = [];
  Object.values(itemChunks).forEach(arr=> combined = combined.concat(arr));
  combined.sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));
  items = combined;
  renderFilters();
  renderGrid();
}, err=> console.error(err));

function renderFilters(){
  const wrap = document.getElementById('categoryFilters');
  const cats = [...new Set(items.map(it => (it.category||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));
  if(!cats.length){ wrap.innerHTML = ''; return; }
  if(!cats.includes(activeCategory) && activeCategory !== 'all') activeCategory = 'all';

  const btn = (val, label) => `<button class="${activeCategory===val?'active':''}" data-cat="${val}">${label}</button>`;
  wrap.innerHTML = btn('all','الكل') + cats.map(c => btn(c, c)).join('');

  wrap.querySelectorAll('[data-cat]').forEach(b=>{
    b.addEventListener('click', ()=>{
      activeCategory = b.dataset.cat;
      currentPage = 1;
      renderFilters();
      renderGrid();
    });
  });
}

function renderGrid(){
  const grid = document.getElementById('galleryGrid');
  const filtered = activeCategory === 'all' ? items : items.filter(it => (it.category||'').trim() === activeCategory);

  if(!filtered.length){
    grid.innerHTML = '<div class="empty-gallery">لا توجد صور بهذا القسم بعد.</div>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if(currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageItems = filtered.slice(start, start + PAGE_SIZE);

  grid.innerHTML = pageItems.map(it => `
    <div class="card">
      <div class="img-wrap"><img src="${it.img}" loading="lazy" alt="${(it.title||it.category||'رخام وحجر طبيعي')} - قيصر الشام للحجر والرخام"></div>
      <div class="body">
        ${it.title ? `<div class="title">${it.title}</div>` : ''}
        <div class="meta">
          ${it.category ? `<b>القسم:</b> ${it.category}<br>` : ''}
          ${it.size ? `<b>القياس:</b> ${it.size}<br>` : ''}
          ${it.color ? `<b>اللون:</b> ${it.color}<br>` : ''}
          ${it.type ? `<b>النوع:</b> ${it.type}<br>` : ''}
          ${it.price ? `<b>السعر:</b> ${it.price}<br>` : ''}
        </div>
      </div>
    </div>
  `).join('');

  renderPagination(totalPages);
}

function renderPagination(totalPages){
  const wrap = document.getElementById('pagination');
  if(totalPages <= 1){ wrap.innerHTML = ''; return; }
  let html = `<button ${currentPage===1?'disabled':''} data-page="${currentPage-1}">‹</button>`;
  for(let i=1;i<=totalPages;i++){
    html += `<button class="${i===currentPage?'active':''}" data-page="${i}">${i}</button>`;
  }
  html += `<button ${currentPage===totalPages?'disabled':''} data-page="${currentPage+1}">›</button>`;
  wrap.innerHTML = html;
  wrap.querySelectorAll('[data-page]').forEach(b=>{
    b.addEventListener('click', ()=>{
      currentPage = parseInt(b.dataset.page);
      renderGrid();
      window.scrollTo({top: document.querySelector('.section').offsetTop - 100, behavior:'smooth'});
    });
  });
}

const burgerBtn = document.getElementById('burgerBtn');
const navWrap = document.getElementById('navWrap');
burgerBtn.addEventListener('click', ()=> navWrap.classList.toggle('open'));
</script>
</body>
</html>
