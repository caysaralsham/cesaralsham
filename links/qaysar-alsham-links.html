<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قيصر الشام للحجر والرخام</title>
<style>
  :root{
    --bg:#141210;
    --bg-2:#1c1916;
    --gold:#b8813f;
    --gold-bright:#d4a05f;
    --cream:#efe6d8;
    --line:#3a332a;
    --red:#a8332a;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{ height:100%; background:var(--bg); }

  body{
    font-family:'Georgia','Amiri', serif;
    color:var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:32px 18px;
    background: radial-gradient(circle at 50% 0%, #241f18 0%, var(--bg) 62%);
    position:relative;
    overflow-x:hidden;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(184,129,63,0.03) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(184,129,63,0.03) 40px);
    pointer-events:none;
  }

  .card{ width:100%; max-width:400px; position:relative; z-index:1; }

  .frame{ border:1px solid var(--line); padding:2px; position:relative; }

  .frame::before{
    content:"";
    position:absolute;
    inset:6px;
    border:1px solid rgba(184,129,63,0.35);
    pointer-events:none;
  }

  .inner{ padding:38px 28px 34px; text-align:center; position:relative; }

  .logo{
    width:150px;
    height:150px;
    object-fit:contain;
    margin:0 auto 18px;
    display:block;
    filter: drop-shadow(0 0 18px rgba(184,129,63,0.15));
  }

  .name-en{
    font-family:Georgia, serif;
    font-size:11px;
    letter-spacing:4px;
    color:var(--gold-bright);
    text-transform:uppercase;
    margin-bottom:6px;
    opacity:0.85;
  }

  .tag{
    font-size:13px;
    letter-spacing:2px;
    color:#a99a7c;
    margin-bottom:26px;
  }

  .divider{
    width:60px; height:1px; background:var(--gold);
    margin:0 auto 26px; opacity:0.6; position:relative;
  }
  .divider::before{
    content:"◆"; position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%); background:var(--bg);
    color:var(--gold); font-size:9px; padding:0 8px;
  }

  .links{ display:flex; flex-direction:column; gap:12px; }

  .link{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:15px 18px; border:1px solid var(--line);
    background:rgba(184,129,63,0.03);
    text-decoration:none; color:var(--cream);
    transition: border-color .25s ease, background .25s ease, transform .15s ease;
    position:relative;
  }
  .link:hover, .link:active{
    border-color:var(--gold); background:rgba(184,129,63,0.09); transform:translateY(-1px);
  }

  .link-left{ display:flex; align-items:center; gap:14px; }

  .icon{ width:20px; height:20px; flex-shrink:0; fill:var(--gold-bright); }

  .link-text{ display:flex; flex-direction:column; align-items:flex-start; text-align:right; }

  .link-label{
    font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:#a99a7c;
  }

  .link-value{ font-size:14px; color:var(--cream); letter-spacing:0.3px; direction:ltr; }

  .arrow{ color:var(--gold); font-size:16px; opacity:0.7; }

  .footer{
    margin-top:30px; font-size:10px; letter-spacing:3px; color:#5c5648; text-transform:uppercase;
  }

  @media (max-width:380px){
    .inner{ padding:32px 18px 26px; }
    .logo{ width:120px; height:120px; }
  }
</style>
</head>
