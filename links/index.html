<style>
  :root{
    --bg:#2E1C10; --bg-2:#3B2414;
    --gold:#B9874F; --gold-bright:#D9B98C;
    --cream:#F5ECDD; --muted:#C9B08F; --line:#5A3A22;
    --ar:'Tajawal', 'Segoe UI', Tahoma, sans-serif;
    --lat:'Montserrat', 'Segoe UI', Arial, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{ background:var(--bg); -webkit-text-size-adjust:100%; }
  body{
    font-family:var(--ar);
    color:var(--cream);
    min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column;
    padding:max(28px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    background: radial-gradient(circle at 50% 0%, #4A2E1A 0%, var(--bg) 62%) fixed, var(--bg);
    position:relative; overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(184,129,63,0.03) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(184,129,63,0.03) 40px);
  }
  /* margin:auto centres the card when it fits, and lets the page scroll normally when it doesn't */
  .card{ width:100%; max-width:420px; margin:auto; position:relative; z-index:1; }
  .frame{ border:1px solid var(--line); padding:2px; position:relative; }
  .frame::before{
    content:""; position:absolute; inset:6px;
    border:1px solid rgba(184,129,63,0.35); pointer-events:none;
  }
  .inner{ padding:36px 24px 30px; text-align:center; position:relative; }

  .logo{
    width:128px; height:128px; object-fit:contain;
    margin:0 auto 18px; display:block;
    filter: drop-shadow(0 0 18px rgba(184,129,63,0.15));
  }
  .name-en{
    font-family:Georgia, serif; font-size:12px; letter-spacing:4px;
    color:var(--gold-bright); text-transform:uppercase; margin-bottom:6px; opacity:.9;
  }
  .tag{ font-size:15px; font-weight:500; color:var(--muted); margin-bottom:24px; }

  .divider{
    width:60px; height:1px; background:var(--gold);
    margin:0 auto 26px; opacity:.6; position:relative;
  }
  .divider::before{
    content:"◆"; position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%); background:var(--bg);
    color:var(--gold); font-size:9px; padding:0 8px;
  }

  .links{ display:grid; grid-template-columns:1fr; gap:10px; }

  .link{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    min-height:64px; padding:12px 16px;
    border:1px solid var(--line); background:rgba(184,129,63,0.03);
    text-decoration:none; color:var(--cream);
    transition: border-color .2s ease, background .2s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .link:hover, .link:active{ border-color:var(--gold); background:rgba(184,129,63,0.09); }
  .link:focus-visible{ outline:2px solid var(--gold-bright); outline-offset:2px; }

  .link-left{ display:flex; align-items:center; gap:14px; min-width:0; }
  .icon{ width:22px; height:22px; flex-shrink:0; fill:var(--gold-bright); }
  .link-text{ display:flex; flex-direction:column; align-items:flex-start; text-align:right; gap:3px; min-width:0; }

  /* labels: Arabic must never get letter-spacing, it breaks the joined letters */
  .link-label{ font-family:var(--ar); font-size:12px; font-weight:500; color:var(--muted); letter-spacing:0; line-height:1.2; }

  .link-value{
    font-family:var(--lat); font-size:15px; font-weight:600; color:var(--cream);
    direction:ltr; line-height:1.3;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;
  }
  .link-value.num{ letter-spacing:1px; font-variant-numeric:tabular-nums; }
  .link-value.ar{ font-family:var(--ar); font-weight:700; font-size:15.5px; direction:rtl; }

  .arrow{ color:var(--gold); font-size:18px; opacity:.7; flex-shrink:0; }

  .footer{
    margin-top:28px; font-family:Georgia, serif; font-size:10px; letter-spacing:3px;
    color:#7A5C40; text-transform:uppercase;
  }

  /* small phones */
  @media (max-width:360px){
    .inner{ padding:30px 16px 24px; }
    .logo{ width:108px; height:108px; }
    .link{ padding:12px 13px; }
    .link-value, .link-value.ar{ font-size:14px; }
  }

  /* tablets & computers: wider card, two columns */
  @media (min-width:720px){
    .card{ max-width:760px; }
    .inner{ padding:44px 40px 36px; }
    .logo{ width:150px; height:150px; }
    .links{ grid-template-columns:1fr 1fr; gap:12px; }
    .link{ min-height:70px; padding:14px 20px; }
  }

  @media (prefers-reduced-motion:reduce){ .link{ transition:none; } }
</style>
